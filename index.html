<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은하 요리 계산기</title>
<style>
:root{
  --bg:#080a1f; --panel:rgba(16,19,48,.88); --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff; --muted:#b9bddb; --line:rgba(255,255,255,.13);
  --accent:#9b8cff; --accent2:#61d6ff;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:
    radial-gradient(circle at 15% 20%, rgba(111,76,255,.38), transparent 28%),
    radial-gradient(circle at 85% 25%, rgba(0,180,255,.23), transparent 25%),
    radial-gradient(circle at 50% 90%, rgba(180,50,255,.18), transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}
body:before{
  content:"✦  ·  ✧     ·       ✦       ·  ✧      ·       ✦       ·    ✧";
  position:fixed; inset:0; pointer-events:none; opacity:.45;
  font-size:32px; letter-spacing:24px; line-height:140px; overflow:hidden;
}
.app{position:relative; max-width:1150px; margin:auto; padding:25px 16px 45px}
.hero{text-align:center; margin-bottom:18px}
.hero h1{margin:0; font-size:clamp(28px,5vw,48px); text-shadow:0 0 24px rgba(150,120,255,.7)}
.hero p{color:var(--muted); margin:8px 0 0}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:22px;
  backdrop-filter:blur(14px); box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.controls{padding:18px; margin-bottom:16px}
.search{width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line);
  background:#080a20; color:var(--text); font-size:16px; outline:none}
.recipe-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; margin-top:14px; max-height:260px; overflow:auto}
..recipe-btn{
  padding:12px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  font-size:18px;
  border-radius:12px;
  cursor:pointer;
  text-align:left
}
 border-radius:12px; cursor:pointer; text-align:left}
.recipe-btn:hover,.recipe-btn.active{border-color:var(--accent2); box-shadow:0 0 16px rgba(97,214,255,.22)}
.grade{font-size:12px; opacity:.75; display:block; margin-bottom:4px}
.content{padding:20px}
.selected{font-size:22px; font-weight:bold; margin:0 0 16px}
.result{padding:18px; border-radius:16px; background:linear-gradient(135deg,rgba(110,85,255,.22),rgba(55,180,255,.14)); border:1px solid rgba(150,150,255,.28); margin-bottom:18px}
.result strong{font-size:clamp(24px,4vw,36px); display:block; margin-top:6px}
.section-title{font-size:18px; font-weight:bold; margin:22px 0 10px}
.table{width:100%; border-collapse:collapse; overflow:hidden; border-radius:14px}
th,td{padding:11px 8px; border-bottom:1px solid var(--line); text-align:center}
th{color:#d9d7ff; background:rgba(255,255,255,.05)}
td:first-child{text-align:left}
input.num{width:82px; padding:9px; border-radius:9px; border:1px solid var(--line); background:#090b23; color:white; text-align:center; font-size:15px}
.owned{white-space:nowrap}
.subrecipes{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px}
.sub{padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.05); border:1px solid var(--line)}
.note{color:var(--muted); font-size:13px}
.empty{text-align:center; color:var(--muted); padding:30px}
@media(max-width:700px){
 .app{padding:14px 8px 30px}.content,.controls{padding:13px}
 th:nth-child(2),td:nth-child(2){display:none}
 .table{font-size:13px} input.num{width:58px}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>🌌 은하 요리 계산기 🍳</h1>
    <p>64개 = 1세트 · 보유 재료를 세트 + 낱개로 입력하세요</p>
  </div>

  <div class="card controls">
    <input id="search" class="search" placeholder="🔎 요리 이름을 검색하세요">
    <div id="recipeList" class="recipe-list"></div>
  </div>

  <div class="card content">
    <div id="appContent" class="empty">위에서 요리를 선택해주세요.</div>
  </div>
</div>

<script>
const STACK=64;

const recipes={
"일반":{
"요정 피쉬 꽃튀김":{"요정 피쉬":1,"마나블라썸":4,"밀가루":4,"빵가루":4},
"호박 마나푸딩":{"마나블라썸":4,"호박 퓌레":4,"우유":4,"각설탕":4},
"젤리 버섯 크림수프":{"젤리버섯":6,"우유":4,"밀가루":4},
"피치 가지 디저트구이":{"피치가지":4,"수박시럽":4,"각설탕":4,"우유":4},
"피치가지 크림닭구이":{"피치가지":4,"익힌 닭고기":4,"우유":4,"수박시럽":4},
"마나블라썸 밀크":{"마나블라썸":6,"우유":4,"각설탕":4},
"피치 가지 수박파르페":{"피치가지":4,"수박시럽":4,"베리소스":4,"우유":4},
"홀로그램 피쉬 바삭튀김":{"홀로그램 피쉬":1,"슬라임 콜라비":4,"밀가루":4,"빵가루":4,"수박시럽":4},
"레드펄 양파 스튜":{"레드펄 양파":6,"감자 전분":4,"고기 육수":4},
"마나블라썸 차":{"마나블라썸":4,"각설탕":4,"우유":4},
"슬라임 콜라비 튀김":{"슬라임 콜라비":6,"밀가루":4,"빵가루":4},
"엔더 콩 스튜":{"엔더 콩":6,"치킨스톡":4,"감자 전분":4},
"초승달 무 샐러드":{"초승달 무":4,"비트소스":4,"베리소스":4},
"슬라임 콜라비 돼지찜":{"슬라임 콜라비":4,"익힌 돼지고기":4,"고기 육수":4,"감자 전분":4},
"젤리 버섯 닭볶음":{"젤리버섯":4,"익힌 닭고기":4,"베리소스":4,"치킨스톡":4},
"팬텀 양배추 소고기스튜":{"팬텀 양배추":4,"익힌 소고기":4,"고기 육수":4,"우유":4},
"팬텀 양배추 고기말이":{"팬텀 양배추":4,"익힌 소고기":4,"익힌 돼지고기":4,"고기 육수":4},
"레드펄 소고기볶음":{"레드펄 양파":4,"익힌 소고기":4,"비트소스":4}
},
"영웅":{
"마나 해산물 스튜":{"요정 피쉬":1,"엔젤 피쉬":1,"마나블라썸":8,"치킨스톡":4,"우유":4},
"엔젤피쉬 황금호박스튜":{"엔젤 피쉬":1,"마나블라썸":8,"호박 퓌레":4,"당근즙":4,"우유":4},
"그림자 생선조림":{"다크 피쉬":1,"고스트 피쉬":1,"엔더 콩":8,"비트소스":4,"고기 육수":4},
"환영 생선 샐러드":{"홀로그램 피쉬":1,"초승달 무":8,"슬라임 콜라비":6,"베리소스":4,"수박시럽":4},
"천상의 크림스튜":{"엔젤 피쉬":1,"피치가지":8,"호박 퓌레":4,"우유":4,"각설탕":4},
"마녀의 심해탕":{"다크 피쉬":1,"젤리버섯":8,"팬텀 양배추":6,"비트소스":4,"치킨스톡":4},
"고스트 피쉬 크림탕":{"고스트 피쉬":1,"팬텀 양배추":8,"우유":4,"치킨스톡":4},
"고스트 피쉬 양배추말이":{"고스트 피쉬":1,"팬텀 양배추":8,"초승달 무":4,"치킨스톡":4},
"요정 피쉬 마나찜":{"요정 피쉬":1,"마나블라썸":8,"당근즙":4,"우유":4},
"홀로그램 피쉬 베리글레이즈":{"홀로그램 피쉬":1,"슬라임 콜라비":8,"베리소스":4,"수박시럽":4},
"다크 피쉬 비트조림":{"다크 피쉬":1,"레드펄 양파":8,"비트소스":4,"고기 육수":4},
"다크 피쉬 매운구이":{"다크 피쉬":1,"엔더 콩":8,"비트소스":4,"빵가루":4},
"엔젤피쉬 크림구이":{"엔젤 피쉬":1,"마나블라썸":6,"우유":4,"호박 퓌레":4,"빵가루":4},
"젤리 버섯 푸딩":{"젤리버섯":8,"우유":4,"각설탕":4,"수박시럽":4}
},
"전설":{
"아스텔라 A급 생선 정식":{"요정 피쉬 마나찜":1,"홀로그램 피쉬 베리글레이즈":1,"다크 피쉬 비트조림":1,"고스트 피쉬 크림탕":1,"엔젤피쉬 황금호박스튜":1},
"아스텔라 축제 도시락":{"레드펄 양파 스튜":1,"슬라임 콜라비 튀김":1,"팬텀 양배추 고기말이":1,"피치 가지 수박파르페":1}
},
"신화":{
"왕실 해산물 만찬":{"마나 해산물 스튜":1,"그림자 생선조림":1,"환영 생선 샐러드":1,"천상의 크림스튜":1,"마나블라썸 밀크":1}
}
};

const all={}; Object.values(recipes).forEach(group=>Object.assign(all,group));
let selected=null, selectedGrade=null;

function expandRecipe(name,amount=1,result={}){
  for(const [item,need] of Object.entries(all[name])){
    const total=need*amount;
    if(all[item]) expandRecipe(item,total,result);
    else result[item]=(result[item]||0)+total;
  }
  return result;
}

function formatStack(n){
  const s=Math.floor(n/STACK), p=n%STACK;
  if(s&&p)return `${n.toLocaleString()}개 (${s}세트 + ${p}개)`;
  if(s)return `${n.toLocaleString()}개 (${s}세트)`;
  return `${n.toLocaleString()}개`;
}

function inventoryKey(name){return "cooking_inventory_"+name}
function getInv(name){
  try{return JSON.parse(localStorage.getItem(inventoryKey(name)))||{sets:0,pieces:0}}catch(e){return {sets:0,pieces:0}}
}
function saveInv(name,sets,pieces){
  localStorage.setItem(inventoryKey(name),JSON.stringify({sets:Number(sets)||0,pieces:Number(pieces)||0}));
}

function renderList(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=document.getElementById("recipeList");
  list.innerHTML="";
  for(const [grade,group] of Object.entries(recipes)){
    for(const name of Object.keys(group)){
      if((grade+" "+name).toLowerCase().includes(q)){
        const b=document.createElement("button");
        b.className="recipe-btn"+(selected===name?" active":"");
        b.innerHTML=`<span class="grade">${grade}</span>${name}`;
        b.onclick=()=>selectRecipe(grade,name);
        list.appendChild(b);
      }
    }
  }
}

function selectRecipe(grade,name){
  selected=name; selectedGrade=grade;
  renderList(); renderRecipe();
}

function renderRecipe(){
  if(!selected)return;
  const content=document.getElementById("appContent");
  const ingredients=(selectedGrade==="전설"||selectedGrade==="신화")?expandRecipe(selected):all[selected];
  const sub=(selectedGrade==="전설"||selectedGrade==="신화")?all[selected]:null;

  let subHtml="";
  if(sub){
    subHtml=`<div class="section-title">🥘 필요한 하위 요리</div>
      <div class="subrecipes">${Object.entries(sub).map(([n,a])=>`<div class="sub">${n} × ${a}</div>`).join("")}</div>
      <div class="section-title">📋 실제 기본 재료</div>`;
  }

  content.innerHTML=`
    <div class="selected">[${selectedGrade}] ${selected}</div>
    <div class="result">
      <span>🍲 만들 수 있는 요리</span>
      <strong id="result">0개</strong>
      <div class="note">가장 부족한 재료를 기준으로 자동 계산됩니다.</div>
    </div>
    ${subHtml}
    <div style="overflow:auto">
    <table class="table">
      <thead><tr><th>재료</th><th>요리 1개 필요량</th><th>보유량</th><th>세트</th><th>낱개</th></tr></thead>
      <tbody>
      ${Object.entries(ingredients).map(([name,need])=>{
        const inv=getInv(name);
        return `<tr>
          <td>${name}</td>
          <td>${need}개</td>
          <td class="owned" id="owned-${cssId(name)}">0개</td>
          <td><input class="num set-input" data-name="${name}" data-need="${need}" type="number" min="0" value="${inv.sets}"></td>
          <td><input class="num piece-input" data-name="${name}" data-need="${need}" type="number" min="0" value="${inv.pieces}"></td>
        </tr>`;
      }).join("")}
      </tbody>
    </table></div>
    <p class="note">💾 입력한 재료 수량은 이 기기의 브라우저에 자동 저장됩니다.</p>
  `;

  document.querySelectorAll(".set-input,.piece-input").forEach(el=>{
    el.addEventListener("input",updateCalculation);
    el.addEventListener("keydown",handleTab);
  });
  updateCalculation();
}

function cssId(name){return btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g,"")}

function updateCalculation(){
  if(!selected)return;
  const req=(selectedGrade==="전설"||selectedGrade==="신화")?expandRecipe(selected):all[selected];
  let possible=Infinity;

  for(const [name,need] of Object.entries(req)){
    const set=document.querySelector(`.set-input[data-name="${CSS.escape(name)}"]`);
    const piece=document.querySelector(`.piece-input[data-name="${CSS.escape(name)}"]`);
    let sets=Math.max(0,Number(set.value)||0), pieces=Math.max(0,Number(piece.value)||0);
    saveInv(name,sets,pieces);
    const owned=Math.floor(sets)*STACK+Math.floor(pieces);
    possible=Math.min(possible,Math.floor(owned/need));
    const cell=document.getElementById("owned-"+cssId(name));
    if(cell)cell.textContent=formatStack(owned);
  }
  if(possible===Infinity)possible=0;
  document.getElementById("result").textContent=formatStack(possible);
}

function handleTab(e){
  if(e.key!=="Tab")return;
  const inputs=[...document.querySelectorAll(".set-input,.piece-input")];
  const i=inputs.indexOf(e.target);
  if(i<0)return;
  e.preventDefault();
  const next=e.shiftKey ? inputs[Math.max(0,i-1)] : inputs[Math.min(inputs.length-1,i+1)];
  next.focus(); next.select();
}

document.getElementById("search").addEventListener("input",renderList);
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const first=document.querySelector(".recipe-btn");
    if(first)first.click();
  }
});
renderList();
</script>
</body>
</html>
