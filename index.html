<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>은하 요리 계산기</title>

<style>
:root{
  --bg:#080a1f;
  --panel:rgba(16,19,48,.88);
  --panel2:rgba(28,32,75,.82);
  --text:#f4f5ff;
  --muted:#b9bddb;
  --line:rgba(255,255,255,.13);
  --accent:#9b8cff;
  --accent2:#61d6ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;

  background:
    radial-gradient(circle at 15% 20%, rgba(111,76,255,.38), transparent 28%),
    radial-gradient(circle at 85% 25%, rgba(0,180,255,.23), transparent 25%),
    radial-gradient(circle at 50% 90%, rgba(180,50,255,.18), transparent 30%),
    linear-gradient(135deg,#050614,#101434 55%,#070818);
}

/* 왼쪽 별 장식 */
body:before{
  content:"✦  ·  ✧     ·       ✦       ·  ✧      ·       ✦       ·    ✧";
  position:fixed;
  left:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  z-index:0;
}

/* 오른쪽 별 장식 */
body:after{
  content:"✧  ·  ✦     ·       ✧       ·  ✦       ·  ✧      ·       ✦";
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100%;
  pointer-events:none;
  opacity:.45;
  font-size:32px;
  letter-spacing:24px;
  line-height:140px;
  overflow:hidden;
  text-align:right;
  z-index:0;
}

.app{
  position:relative;
  z-index:1;
  max-width:1150px;
  margin:auto;
  padding:25px 16px 45px;
}

.hero{
  text-align:center;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 0 24px rgba(150,120,255,.7);
}

.hero p{
  color:var(--muted);
  margin:8px 0 0;
  font-size:17px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.controls{
  padding:18px;
  margin-bottom:16px;
}

.search{
  width:100%;
  padding:16px 18px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#080a20;
  color:var(--text);
  font-size:19px;
  outline:none;
}

.recipe-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px;
  margin-top:14px;
  max-height:300px;
  overflow:auto;
}

.recipe-btn{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
  text-align:left;
  font-size:19px;
  font-weight:bold;
}

.recipe-btn:hover,
.recipe-btn.active{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(97,214,255,.22);
}

.grade{
  font-size:14px;
  opacity:.75;
  display:block;
  margin-bottom:5px;
}

.content{
  padding:20px;
}

.selected{
  font-size:26px;
  font-weight:bold;
  margin:0 0 16px;
}

.result{
  padding:18px;
  border-radius:16px;
  background:linear-gradient(
    135deg,
    rgba(110,85,255,.22),
    rgba(55,180,255,.14)
  );
  border:1px solid rgba(150,150,255,.28);
  margin-bottom:18px;
  font-size:18px;
}

.result strong{
  font-size:clamp(28px,4vw,42px);
  display:block;
  margin-top:6px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:22px 0 10px;
}

.table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
  font-size:16px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
}

th{
  color:#d9d7ff;
  background:rgba(255,255,255,.05);
  font-size:16px;
}

td:first-child{
  text-align:left;
  font-weight:bold;
}

input.num{
  width:90px;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  text-align:center;
  font-size:17px;
}

/* =========================
   숫자 입력칸 위아래 화살표 제거
========================= */

/* 크롬 / 엣지 / 사파리 */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

/* 파이어폭스 */
input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}

.owned{
  white-space:nowrap;
}

.subrecipes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}

.sub{
  padding:13px 14px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:16px;
}

.note{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
  font-size:18px;
}

.category-row td{
  text-align:left !important;
  font-size:18px !important;
  font-weight:bold !important;
  padding:14px 12px !important;
  background:rgba(255,255,255,.08);
  border-top:1px solid var(--line);
}

/* =========================
   단체주문 고정 패널
========================= */

.order-panel{
  position:fixed;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  width:260px;
  z-index:10;
  background:rgba(12,15,42,.94);
  border:1px solid rgba(155,140,255,.45);
  border-radius:18px;
  padding:16px;
  box-shadow:
    0 15px 40px rgba(0,0,0,.45),
    0 0 20px rgba(120,100,255,.12);
  backdrop-filter:blur(15px);
}

.order-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
  text-align:center;
}

.order-label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin:10px 0 5px;
}

.order-input,
.order-select{
  width:100%;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#090b23;
  color:white;
  font-size:15px;
}

.order-info{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid var(--line);
}

.order-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:8px 0;
  font-size:14px;
}

.order-row span:first-child{
  color:var(--muted);
}

.order-value{
  font-weight:bold;
  text-align:right;
}

.order-total{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:linear-gradient(
    135deg,
    rgba(110,85,255,.22),
    rgba(55,180,255,.14)
  );
  border:1px solid rgba(150,150,255,.25);
}

.order-total strong{
  display:block;
  margin-top:4px;
  font-size:18px;
}

@media(max-width:1450px){

  .order-panel{
    position:relative;
    left:auto;
    top:auto;
    transform:none;
    width:auto;
    max-width:1150px;
    margin:0 auto 16px;
  }

}

@media(max-width:700px){

  .app{
    padding:14px 8px 30px;
  }

  .content,
  .controls{
    padding:13px;
  }

  th:nth-child(2),
  td:nth-child(2){
    display:none;
  }

  .table{
    font-size:13px;
  }

  input.num{
    width:60px;
  }

  .recipe-btn{
    font-size:18px;
  }

  body:before,
  body:after{
    font-size:24px;
    letter-spacing:14px;
    line-height:110px;
  }

}
</style>

</head>

/* 단체주문 저장 */

function saveOrderInfo(){

  const data = {
    food:document.getElementById("orderFood").value,
    multiplier:document.getElementById("orderMultiplier").value,
    price:document.getElementById("orderPrice").value,
    bonus:document.getElementById("bonusRate").value
  };

  localStorage.setItem(
    ORDER_STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* 단체주문 불러오기 */

function loadOrderInfo(){

  const saved =
    localStorage.getItem(
      ORDER_STORAGE_KEY
    );

  if(!saved) return;

  try{

    const data =
      JSON.parse(saved);

    document.getElementById("orderFood").value =
      data.food || "";

    document.getElementById("orderMultiplier").value =
      data.multiplier || "";

    document.getElementById("orderPrice").value =
      data.price || "";

    document.getElementById("bonusRate").value =
      data.bonus || "0";

  }catch(error){

    console.error(
      "단체주문 정보를 불러오지 못했습니다.",
      error
    );

  }

}


/* 크론 표시 */

function formatCron(value){

  const number =
    Math.round(value || 0);

  return number.toLocaleString()
    + "크론";

}


/* 단체주문 금액 계산 */

function updateOrderCalculation(){

  const price =
    Math.max(
      0,
      Number(
        document
          .getElementById("orderPrice")
          .value
      ) || 0
    );

  const bonus =
    Math.max(
      0,
      Number(
        document
          .getElementById("bonusRate")
          .value
      ) || 0
    );

  const finalUnitPrice =
    price * (1 + bonus / 100);

  const oneStackPrice =
    finalUnitPrice * STACK;

  const total =
    finalUnitPrice * currentPossible;

  document
    .getElementById("finalUnitPrice")
    .textContent =
    formatCron(finalUnitPrice);

  document
    .getElementById("stackPrice")
    .textContent =
    formatCron(oneStackPrice);

  document
    .getElementById("possibleCount")
    .textContent =
    formatStack(currentPossible);

  document
    .getElementById("totalPrice")
    .textContent =
    formatCron(total);

}


/* 전설 / 신화 기본 재료 계산 */

function expandRecipe(name, amount=1, result={}){

  for(
    const [item,need]
    of Object.entries(all[name])
  ){

    const total =
      need * amount;

    if(all[item]){

      expandRecipe(
        item,
        total,
        result
      );

    }else{

      result[item] =
        (result[item] || 0)
        + total;

    }

  }

  return result;

}


/* 세트 표시 */

function formatStack(n){

  const sets =
    Math.floor(n / STACK);

  const pieces =
    n % STACK;

  if(sets && pieces){
    return `${n.toLocaleString()}개 (${sets}세트 + ${pieces}개)`;
  }

  if(sets){
    return `${n.toLocaleString()}개 (${sets}세트)`;
  }

  return `${n.toLocaleString()}개`;

}


/* 재료 카테고리 */

const FISH = [
  "요정 피쉬",
  "엔젤 피쉬",
  "다크 피쉬",
  "고스트 피쉬",
  "홀로그램 피쉬"
];

const CROPS = [
  "마나블라썸",
  "피치가지",
  "젤리버섯",
  "팬텀 양배추",
  "레드펄 양파",
  "슬라임 콜라비",
  "엔더 콩",
  "초승달 무"
];


/* 재료 카테고리 판별 */

function getIngredientCategory(name){

  if(FISH.includes(name)){
    return 1;
  }

  if(CROPS.includes(name)){
    return 2;
  }

  return 3;

}


function getCategoryName(category){

  if(category === 1){
    return "🐟 피쉬";
  }

  if(category === 2){
    return "🌱 작물";
  }

  return "🧂 가공재료";

}


function createGroupedIngredientRows(ingredients){

  const groups = {
    1: [],
    2: [],
    3: []
  };

  Object.entries(ingredients)
    .forEach(([name,need])=>{

      const category =
        getIngredientCategory(name);

      groups[category].push([
        name,
        need
      ]);

    });

  let html = "";

  for(
    let category = 1;
    category <= 3;
    category++
  ){

    if(
      groups[category].length === 0
    ){
      continue;
    }

    groups[category].sort(
      ([a],[b])=>
        a.localeCompare(b,"ko")
    );

    html += `
      <tr class="category-row">
        <td colspan="5">
          ${getCategoryName(category)}
        </td>
      </tr>
    `;

    groups[category]
      .forEach(([name,need])=>{

        html += createIngredientRow(
          name,
          need
        );

      });

  }

  return html;

}


/* 일반 재료 행 생성 */

function createIngredientRow(name,need){

  return `
    <tr>

      <td>
        ${name}
      </td>

      <td>
        ${need}개
      </td>

      <td
        class="owned"
        id="owned-${cssId(name)}"
      >
        0개
      </td>

      <td>
        <input
          class="num set-input"
          data-name="${name}"
          type="number"
          min="0"
          value="0"
        >
      </td>

      <td>
        <input
          class="num piece-input"
          data-name="${name}"
          type="number"
          min="0"
          value="0"
        >
      </td>

    </tr>
  `;

}


/* 요리 목록 표시 */

function renderList(){

  const q =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const list =
    document.getElementById(
      "recipeList"
    );

  list.innerHTML = "";

  for(
    const [grade,group]
    of Object.entries(recipes)
  ){

    for(
      const name
      of Object.keys(group)
    ){

      if(
        (grade + " " + name)
          .toLowerCase()
          .includes(q)
      ){

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "recipe-btn"
          +
          (
            selected === name
            ?
            " active"
            :
            ""
          );

        button.innerHTML = `
          <span class="grade">
            ${grade}
          </span>

          ${name}
        `;

        button.onclick = ()=>{

          selectRecipe(
            grade,
            name
          );

        };

        list.appendChild(button);

      }

    }

  }

}


/* 요리 선택 */

function selectRecipe(grade,name){

  selected = name;
  selectedGrade = grade;

  renderList();
  renderRecipe();

}


/* 요리 화면 표시 */

function renderRecipe(){

  if(!selected) return;

  const content =
    document.getElementById(
      "appContent"
    );

  const isHighGrade =
    selectedGrade === "전설"
    ||
    selectedGrade === "신화";

  const ingredients =
    isHighGrade
    ?
    expandRecipe(selected)
    :
    all[selected];

  const sub =
    isHighGrade
    ?
    all[selected]
    :
    null;

  let subHtml = "";

  if(sub){

    subHtml = `
      <div class="section-title">
        🥘 필요한 하위 요리
      </div>

      <div class="subrecipes">

        ${
          Object.entries(sub)
          .map(([name,amount])=>`

            <div class="sub">
              ${name} × ${amount}
            </div>

          `)
          .join("")
        }

      </div>

      <div class="section-title">
        📋 실제 기본 재료
      </div>
    `;

  }

  const ingredientRows =
    isHighGrade
    ?
    createGroupedIngredientRows(
      ingredients
    )
    :
    Object.entries(ingredients)
      .map(([name,need])=>
        createIngredientRow(
          name,
          need
        )
      )
      .join("");

  content.innerHTML = `

    <div class="selected">
      [${selectedGrade}]
      ${selected}
    </div>

    <div class="result">

      <span>
        🍲 만들 수 있는 요리
      </span>

      <strong id="result">
        0개
      </strong>

      <div class="note">
        가장 부족한 재료를 기준으로 자동 계산됩니다.
      </div>

    </div>

    ${subHtml}

    <div style="overflow:auto">

      <table class="table">

        <thead>
          <tr>
            <th>재료</th>
            <th>요리 1개 필요량</th>
            <th>보유량</th>
            <th>세트</th>
            <th>낱개</th>
          </tr>
        </thead>

        <tbody>
          ${ingredientRows}
        </tbody>

      </table>

    </div>
  `;

  document
    .querySelectorAll(
      ".set-input,.piece-input"
    )
    .forEach(el=>{

      el.addEventListener(
        "input",
        updateCalculation
      );

      el.addEventListener(
        "keydown",
        handleTab
      );

    });

  updateCalculation();

}


/* HTML ID 생성 */

function cssId(name){

  return btoa(
    unescape(
      encodeURIComponent(name)
    )
  )
  .replace(
    /[^a-zA-Z0-9]/g,
    ""
  );

}


/* 만들 수 있는 요리 계산 */

function updateCalculation(){

  if(!selected){

    currentPossible = 0;

    updateOrderCalculation();

    return;

  }

  const req =
    (
      selectedGrade === "전설"
      ||
      selectedGrade === "신화"
    )
    ?
    expandRecipe(selected)
    :
    all[selected];

  let possible = Infinity;

  for(
    const [name,need]
    of Object.entries(req)
  ){

    const setInput =
      document.querySelector(
        `.set-input[data-name="${CSS.escape(name)}"]`
      );

    const pieceInput =
      document.querySelector(
        `.piece-input[data-name="${CSS.escape(name)}"]`
      );

    if(
      !setInput
      ||
      !pieceInput
    ){
      continue;
    }

    const sets =
      Math.max(
        0,
        Number(
          setInput.value
        ) || 0
      );

    const pieces =
      Math.max(
        0,
        Number(
          pieceInput.value
        ) || 0
      );

    const owned =
      Math.floor(sets)
      * STACK
      +
      Math.floor(pieces);

    possible =
      Math.min(
        possible,
        Math.floor(
          owned / need
        )
      );

    const cell =
      document.getElementById(
        "owned-"
        +
        cssId(name)
      );

    if(cell){

      cell.textContent =
        formatStack(owned);

    }

  }

  if(possible === Infinity){
    possible = 0;
  }

  currentPossible =
    possible;

  document
    .getElementById("result")
    .textContent =
    formatStack(possible);

  updateOrderCalculation();

}


/* TAB 키 이동 */

function handleTab(e){

  if(e.key !== "Tab"){
    return;
  }

  const inputs = [
    ...document.querySelectorAll(
      ".set-input,.piece-input"
    )
  ];

  const index =
    inputs.indexOf(
      e.target
    );

  if(index < 0){
    return;
  }

  e.preventDefault();

  let next;

  if(e.shiftKey){

    next =
      inputs[
        Math.max(
          0,
          index - 1
        )
      ];

  }else{

    next =
      inputs[
        Math.min(
          inputs.length - 1,
          index + 1
        )
      ];

  }

  next.focus();
  next.select();

}

[
